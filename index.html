<script>
(()=>{'use strict';
/* ---------- constants ---------- */
const KEY='aos_fv_module_v2';
const USERS=[{name:'Ayush Gunjal',role:'Manager'},{name:'Aakansha Gupta',role:'Team Lead'},{name:'Kashish Yadav',role:'Employee'},{name:'Aakash Yadgiri',role:'Employee'},{name:'Megha Saboo',role:'Employee'},{name:'Neha Kulkarni',role:'Employee',dept:'HR'},{name:'Accounts Desk',role:'Accounts'}];

const typeOpts=val=>[['Sales visit',T_SALES],['Field discovery',T_DISC],['HR visit',T_HR]].map(g=>`<optgroup label="${g[0]}">${opts(g[1],val)}</optgroup>`).join('');

const DISC=['Identified Only','Details Collected','Contacted','Interested','Qualified','Follow-up Required','Not Interested','Access Denied'];
const CRM_P=['No change','Mark as Interested','Convert to Lead'],CRM_O=['No change','Move to Qualified','Mark Closed Won','Mark Closed Lost'];

const CATS=[{n:'Cab / Auto / Taxi',l:1500},{n:'Public Transport',l:500},{n:'Fuel / Mileage',l:0},{n:'Parking',l:300},{n:'Toll',l:0},{n:'Meals',l:600},{n:'Accommodation',l:3500},{n:'Other',l:500}];

 modal((c?'Edit ':'Add ')+B.co+' · '+id,`<div class="note"><span>Partial records are fine, so contact details can be added later. Duplicates are checked against Prospects, Opportunities and other ${X?'exhibitors':'companies'} already recorded.</span></div><div class="grid2">${sl('cSite',B.site,v.sites.map(s=>[s.id,s.name]),c?c.siteId:(sid0||v.sites[v.sites.length-1].id))}${fld('cName',B.co+' Name *',c?.name)}${sl('cInd','Industry',['IT / Software','Manufacturing','Services','Finance','Healthcare','Retail','Other'],c?.industry)}${fld('cFloor',B.stall,c?.floor)}${fld('cWeb','Website',c?.website)}${fld('cCont','Contact Person',c?.contact)}${fld('cDes','Designation',c?.designation)}${fld('cPh','Phone',c?.phone,'tel')}${fld('cMail','Email',c?.email,'email')}${X?fld('cOff','What they offer (products / services)',c?.offering,'text','','full'):''}${sl('cStat','Outcome',X?DISC_X:DISC,c?.status||(X?'Noted Only':'Identified Only'))}${fld('cReq','Software need (CRM / ERP / HRMS…)',c?.requirement)}${fld('cFol','Follow-up date',c?.followup,'date')}${ta('cNotes','Remarks',c?.notes)}</div>`,`<button class="btn" data-act="view" data-id="${id}">Back</button><button class="btn p" data-act="saveCompany" data-id="${id}" data-cid="${cid||''}">Save ${B.co}</button>`)}

 if(cid){let cur=null,from=null;v.sites.forEach(s=>{const x=(s.companies||[]).find(c=>c.id===cid);if(x){cur=x;from=s}});Object.assign(cur,o);if(from.id!==sid){from.companies=from.companies.filter(c=>c.id!==cid);v.sites.find(s=>s.id===sid).companies.push(cur)}hist(v,LB(v).co+' updated: '+name)}else{const s=v.sites.find(x=>x.id===sid);s.companies=s.companies||[];s.companies.push(Object.assign({id:uid('c'),prospectId:''},o));hist(v,LB(v).co+' recorded at '+s.name+': '+name)}detail(id);draw();toast('Saved')}

function toProspect(id,sid,cid){const v=byId(id),s=v.sites.find(x=>x.id===sid),c=s.companies.find(x=>x.id===cid);const d=dupMatches(c.name,cid).filter(x=>!/^(Exploration|Exhibition) /.test(x));if(d.length&&!confirm('Already in CRM:\n• '+d.join('\n• ')+'\n\nCreate another prospect anyway?'))return;const n=Math.max(0,...DB.prospects.map(p=>+p.id.split('-')[1]||0))+1,p={id:'PR-'+String(n).padStart(4,'0'),company:c.name,contact:c.contact,phone:c.phone,address:isExh(v)?v.location:s.area,geo:s.gps?s.gps.replace(/\s/g,''):'',stage:isQual(c)?'Interested':'Assigned',owner:v.assignee,source:isExh(v)?'Exhibition '+v.id+' ('+v.eventName+')':'Field Exploration '+v.id};DB.prospects.push(p);c.prospectId=p.id;hist(v,c.name+' added to Prospects as '+p.id+' (simulated CRM write)');pushN('Manager',c.name+' added as prospect '+p.id+' from '+v.id,v.id);detail(id);draw();toast('Prospect '+p.id+' created (simulated: a live CRM writes to Prospects)')}

function reviewClaim(id,cid){const v=byId(id),c=v.claims.find(x=>x.id===cid);if(!c||c.status!=='Submitted'||!canAct(c.chain,c.step,v.assignee)){toast(v.assignee===S.user?'You cannot approve your own claim.':'Not allowed.');return}const fl=flagItems(c.items);
 modal('Review Claim · '+c.id,`<p><b>${esc(v.assignee)}</b> · ${esc(v.id)} · Level ${c.step+1}/${c.chain.length} (${esc(c.chain[c.step])})</p><div class="dg"><div><div class="k">Employee-paid (to reimburse)</div><div class="v">${money(claimTotal(c))}</div></div><div><div class="k">Company-provided (internal)</div><div class="v">${money(claimInternal(c))}</div></div><div><div class="k">Policy flags</div><div class="v">${nFlags(c)?nFlags(c)+' over limit':'None'}</div></div></div>${c.remarks?`<div class="note"><span>Employee remarks: ${esc(c.remarks)}</span></div>`:''}<div class="tw"><table class="tbl"><thead><tr><th>Type</th><th>Category</th><th>Date</th><th>Details</th><th>Claimed</th><th>Receipt</th><th>Approve ₹</th></tr></thead><tbody>${c.items.map((i,ix)=>{const int=i.kind==='internal';return `<tr><td>${tchip(i)}</td><td>${esc(i.category)}${i.km?'<div class="sub-t">'+i.km+' km</div>':''}</td><td>${fmtD(i.date)}</td><td>${esc(i.desc)}${int&&i.ref?`<div class="sub-t">Ref: ${esc(i.ref)}</div>`:''}${!int?`<div class="sub-t">Paid via ${esc(i.mode)}</div>`:''}${i.note?`<div class="sub-t">Note: ${esc(i.note)}</div>`:''}${fl[ix]?`<div class="sub-t" style="color:var(--red);font-weight:600">${esc(fl[ix])}</div>`:''}</td><td>${money(i.amount)}${int?'<div class="sub-t">company cost</div>':''}</td><td>${i.receipt?thumbs([i.receipt],'c:'+c.id,v.id).replace(/data-src="c:([^:]+):0"/,'data-src="c:$1:'+ix+'"'):'—'}</td><td>${int?'<span class="muted">Not reimbursed</span>':`<input type="number" class="apAmt" data-i="${ix}" min="0" max="${i.amount}" step="0.01" style="width:90px;padding:5px;border:1px solid #cdd6e0;border-radius:4px" value="${i.approved!=null?i.approved:i.amount}">`}</td></tr>`}).join('')}</tbody></table></div><div class="grid2" style="margin-top:10px">${ta('rvNote','Remarks (required to return / reject / reduce)')}</div>${isMgr()&&c.chain.length-c.step>1?'<div class="subtext">As Manager, approving completes all remaining levels.</div>':''}<div class="subtext">Internal lines are company-provided. They are checked and recorded but not paid out.</div>`,`<button class="btn" data-act="view" data-id="${id}">Back</button><button class="btn d" data-act="decideClaim" data-id="${id}" data-cid="${cid}" data-r="Rejected">Reject</button><button class="btn" data-act="decideClaim" data-id="${id}" data-cid="${cid}" data-r="Returned">Return for Correction</button><button class="btn g" data-act="decideClaim" data-id="${id}" data-cid="${cid}" data-r="Approved">Approve</button>`,'wide')}
function decideClaim(id,cid,r){const v=byId(id),c=v.claims.find(x=>x.id===cid);if(!c||!canAct(c.chain,c.step,v.assignee)){toast('Not allowed.');return}const note=fv('rvNote');let cut=false;$$('.apAmt').forEach(inp=>{const i=+inp.dataset.i,a=Math.min(Math.max(+inp.value||0,0),c.items[i].amount);if(a<c.items[i].amount)cut=true;c.items[i]._ap=a});
 if(r!=='Approved'&&!note){c.items.forEach(i=>{delete i._ap});toast('Add remarks for '+r.toLowerCase()+'.');return}if(r==='Approved'&&cut&&!note){c.items.forEach(i=>{delete i._ap});toast('Add a reason for the reduced amount.');return}c.trail.push({at:new Date().toISOString(),by:S.user,role:role(),action:r,note});
 if(r==='Approved'){c.items.forEach(i=>{if(i.kind!=='internal'&&i._ap!=null)i.approved=i._ap;delete i._ap});c.step=isMgr()?c.chain.length:c.step+1;c.approvedTotal=Math.round(c.items.reduce((a,i)=>a+(i.kind==='internal'?0:(+i.approved||0)),0)*100)/100;
  if(c.step>=c.chain.length){if(c.approvedTotal>0){c.status='Approved';hist(v,c.id+' approved: '+money(c.approvedTotal)+' to reimburse');pushN('Accounts',c.id+' approved for '+money(c.approvedTotal)+', payment due',v.id);pushN(v.assignee,'Claim '+c.id+' approved for '+money(c.approvedTotal)+'; payment pending',v.id)}else{c.status='Closed';hist(v,c.id+' closed: nothing to reimburse (company-provided costs recorded)');pushN(v.assignee,'Claim '+c.id+' is closed. No reimbursement due; company-provided costs are recorded.',v.id)}}else{hist(v,c.id+' approved at level '+c.step+'; forwarded to '+c.chain[c.step]);pushN(c.chain[c.step],'Expense claim '+c.id+' awaits your approval',v.id)}}
 else{c.items.forEach(i=>{delete i._ap});c.status=r;c.step=0;if(r==='Rejected')c.approvedTotal=0;hist(v,c.id+' '+r.toLowerCase()+' — '+note);pushN(v.assignee,'Claim '+c.id+' was '+r.toLowerCase()+': '+note,v.id)}
 closeM();draw();detail(id);toast('Claim '+r.toLowerCase())}
function payForm(id,cid){const v=byId(id),c=v.claims.find(x=>x.id===cid);if(!c||c.status!=='Approved'||!(isAcc()||isMgr())){toast('Only Accounts (or Manager) can record payment.');return}modal('Record Reimbursement · '+c.id,`<p><b>${esc(v.assignee)}</b> · approved <b>${money(c.approvedTotal)}</b> (employee-paid lines only)</p><div class="grid2">${fld('pDate','Payment date *',today(),'date')}${sl('pMode','Method',['Bank Transfer','UPI','Cash','Payroll'])}${fld('pRef','Transaction / UTR reference *')}${ta('pNotes','Accounts notes')}</div><div class="subtext">Prototype only. No real payment is made.</div>`,`<button class="btn" data-act="close">Cancel</button><button class="btn g" data-act="confirmPay" data-id="${id}" data-cid="${cid}">Mark Reimbursed</button>`)}
function confirmPay(id,cid){const v=byId(id),c=v.claims.find(x=>x.id===cid);if(!fv('pRef')||!fv('pDate')){toast('Date and reference are required.');return}c.status='Reimbursed';c.pay={ref:fv('pRef'),date:fv('pDate'),mode:fv('pMode'),notes:fv('pNotes')};c.trail.push({at:new Date().toISOString(),by:S.user,role:role(),action:'Reimbursed',note:fv('pRef')});hist(v,c.id+' reimbursed — ref '+c.pay.ref);pushN(v.assignee,'Claim '+c.id+' reimbursed: '+money(c.approvedTotal)+' (ref '+c.pay.ref+')',v.id);closeM();draw();toast('Payment recorded')}
/* ---------- files ---------- */
function compress(file,tag){return new Promise(res=>{if(/^image\//.test(file.type)){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({name:file.name,type:'image/jpeg',data:c.toDataURL('image/jpeg',.6),tag})};im.onerror=()=>res({name:file.name,type:file.type,data:null,tag});im.src=fr.result};fr.onerror=()=>res({name:file.name,type:file.type,data:null,tag});fr.readAsDataURL(file)}else if(file.size<150*1024){const fr=new FileReader();fr.onload=()=>res({name:file.name,type:file.type,data:fr.result,tag});fr.onerror=()=>res({name:file.name,type:file.type,data:null,tag});fr.readAsDataURL(file)}else res({name:file.name,type:file.type,data:null,tag})})}
function getFile(vid,src){const v=byId(vid),p=src.split(':');if(p[0]==='f')return v.files[+p[1]];if(p[0]==='r'){const k=(v.cands||[]).find(x=>x.id===p[1]);return k?k.resume:null}const c=v.claims.find(x=>x.id===p[1]);return c&&c.items[+p[2]]?c.items[+p[2]].receipt:null}
function viewFile(vid,src){const f=getFile(vid,src);if(!f)return;modal(f.name||'File',f.data&&/^data:image/.test(f.data)?`<img src="${f.data}" alt="${esc(f.name)}" style="max-width:100%;display:block;margin:auto;border-radius:6px">`:`<div class="empty">Preview not available — only the file name <b>${esc(f.name)}</b> is stored in this prototype.</div>`,`<button class="btn" data-act="view" data-id="${vid}">Back</button>`)}
